name: Classroom integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ephemeral_test_only
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ephemeral_test_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node scripts/publish.mjs
      - run: psql -X -v ON_ERROR_STOP=1 -f tests/classroom-postgres.sql
      - name: Test the email and review screens with a simulated provider
        env:
          NODE_PATH: ${{ runner.temp }}/capstone-browser/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/capstone-browser" --no-audit --no-fund playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome)" node tests/cloud-browser.cjs
