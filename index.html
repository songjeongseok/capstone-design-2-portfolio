<script>
let db=null,assetsApi=null,sampleApi=null,capsReady=false;const heroImage='portfolio-hero.jpg';
async function initCaps(){if(typeof window.claude==='undefined'){capsReady=true;return}try{db=await window.claude.use('db')}catch(e){db=null}try{assetsApi=await window.claude.use('assets')}catch(e){assetsApi=null}try{sampleApi=await window.claude.use('sample')}catch(e){sampleApi=null}capsReady=true}
function normDocs(snap){try{if(Array.isArray(snap))return snap.map(d=>d&&typeof d.data==='function'?{id:d.id,...d.data()}:d);if(snap&&Array.isArray(snap.docs))return snap.docs.map(d=>({id:d.id,...(typeof d.data==='function'?d.data():(d.data||{}))}));if(snap&&typeof snap==='object')return Object.entries(snap).map(([id,v])=>({id,...(v||{})}))}catch(e){}return[]}
async function ensureStudents(){if(!db)return Array.from({length:15},(_,i)=>({id:'s'+(i+1),name:'학생 '+(i+1),order:i+1}));let list=[];try{list=normDocs(await db.collection('students').get())}catch(e){}if(!list.length){for(let i=1;i<=15;i++){try{await db.doc('students/s'+i).set({name:'학생 '+i,order:i})}catch(e){}}try{list=normDocs(await db.collection('students').get())}catch(e){}if(!list.length)list=Array.from({length:15},(_,i)=>({id:'s'+(i+1),name:'학생 '+(i+1),order:i+1}))}return list.sort((a,b)=>(a.order||0)-(b.order||0))}
const sampleUploads={

};
async function getUploads(studentId){if(!db)return sampleUploads[studentId]||[];try{const rows=normDocs(await db.collection('uploads').where('studentId','==',studentId).get());return (rows.length?rows:(sampleUploads[studentId]||[])).sort((a,b)=>(a.week||0)-(b.week||0))}catch(e){return sampleUploads[studentId]||[]}}
function esc(v){return(v||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pad(v){return String(v||0).padStart(2,'0')}function latestLabel(rows){return rows.length?`WEEK ${pad(Math.max(...rows.map(u=>u.week||0)))}`:'NOT STARTED'}
const reviewRules={
  spatial:{label:'공간 구성',weight:.25,terms:['대지','면적','프로그램','배치','공용','작업실','공간']},
  circulation:{label:'동선·무장애',weight:.20,terms:['동선','시선축','출입','반입','회전','폭','휠체어','접근']},
  technical:{label:'구조·시공',weight:.20,terms:['구조','기둥','철골','단면','접합','프레임','치수','모듈']},
  environment:{label:'환경·재료',weight:.20,terms:['채광','일사','환기','흡음','재료','콘크리트','저VOC','에너지']},
  evidence:{label:'검증 근거',weight:.15,terms:['㎡','m','%','1:','수치','기준','피크타임','인증']}
};
function analyzeRecord(u){
  const text=`${u.title||''} ${u.description||''} ${recordSpecs[u.id]||''}`.toLowerCase();
  const result={};let total=0,evidence=0;
  Object.entries(reviewRules).forEach(([key,rule])=>{const hits=rule.terms.filter(t=>text.includes(t.toLowerCase())).length;const score=Math.min(96,Math.round(44+hits*10+(text.length>180?8:0)));result[key]={score,hits};total+=score*rule.weight;if(key==='evidence')evidence=hits});
  const lowest=Object.entries(result).sort((a,b)=>a[1].score-b[1].score)[0][0];
  return {scores:result,total:Math.round(total),evidence,weakest:reviewRules[lowest].label,priority:result[lowest].score<65?'높음':result[lowest].score<78?'중간':'낮음'};
}
function aggregateReviews(uploads){
  if(!uploads.length)return {total:0,evidence:0,weakest:'자료 없음',priority:'높음',scores:{}};
  const analyses=uploads.map(analyzeRecord),scores={};Object.keys(reviewRules).forEach(k=>scores[k]=Math.round(analyses.reduce((sum,a)=>sum+a.scores[k].score,0)/analyses.length));
  const weak=Object.entries(scores).sort((a,b)=>a[1]-b[1])[0][0];
  return {total:Math.round(analyses.reduce((sum,a)=>sum+a.total,0)/analyses.length),evidence:analyses.reduce((sum,a)=>sum+a.evidence,0),weakest:reviewRules[weak].label,priority:scores[weak]<65?'높음':scores[weak]<78?'중간':'낮음',scores};
}
function renderReviewDashboard(summary){return `<section class="review-dashboard" aria-labelledby="reviewDashboardTitle"><div class="review-score"><div class="score-ring"><span>${summary.total}<small>/100</small></span></div><div><h2 id="reviewDashboardTitle">AI Review Lens</h2><p>설계 기록 ${summary.total?'평균':''} 종합 점수 · 우선순위 <b>${summary.priority}</b></p></div></div><div class="metric-grid">${Object.entries(reviewRules).map(([key,rule])=>`<div class="metric"><div class="metric-label"><span>${rule.label}</span><strong>${summary.scores[key]||0}</strong></div><div class="metric-bar"><i style="width:${summary.scores[key]||0}%"></i></div></div>`).join('')}</div><div class="review-method"><b>RUBRIC V1.0</b> 공간 구성 25% · 동선·무장애 20% · 구조·시공 20% · 환경·재료 20% · 검증 근거 15% / 키워드·치수·설명 근거를 탐지한 사전 분석이며, 서술형 AI 코멘트와 함께 지도 검토에 사용합니다.</div></section>`}

async function renderHome(app){app.innerHTML='<p class="empty">포트폴리오를 불러오는 중입니다.</p>';const students=await ensureStudents(),counts={};await Promise.all(students.map(async s=>counts[s.id]=(await getUploads(s.id)).length));const total=Object.values(counts).reduce((sum,n)=>sum+n,0);document.getElementById('headerCount').textContent=`${students.length} Students`;app.innerHTML=`<section class="hero" aria-labelledby="homeTitle"><div class="hero-copy"><div class="eyebrow">2026 · Interior Architecture Studio</div><h1 id="homeTitle">SPACE,<br><em>IN PROCESS.</em></h1><p class="hero-text">관찰과 실험, 그리고 설계의 흔적을 한 장면씩 기록합니다. 각자의 공간 언어가 완성되어 가는 캡스톤디자인2 아카이브입니다.</p><div class="hero-footer"><div class="hero-index"><strong>${pad(students.length)}</strong>STUDENT ARCHIVES</div><div class="scroll-hint">EXPLORE <span></span></div></div></div><div class="hero-art"><img src="${heroImage}" alt="추상적인 건축 모형" onerror="this.style.display='none'"><div class="art-grid"></div><div class="art-label"><strong>Material Study 01</strong>FORM / LIGHT / VOID</div></div></section><section aria-labelledby="archiveTitle"><div class="section-head"><h2 id="archiveTitle">Student <i>Archives</i></h2><p class="section-note">학생별 진행 과정을 선택해 주차별 설계 기록과 지도 코멘트를 확인하세요.</p></div><div class="student-grid">${students.map(s=>`<button class="student-card" onclick="location.hash='/s/${s.id}'" aria-label="${esc(s.name)} 포트폴리오 열기"><span class="student-num">ARCHIVE / ${pad(s.order)}</span><h3>${esc(s.name)}<span>↗</span></h3><div class="card-bottom"><span class="student-count">${counts[s.id]||0}개의 기록 · ${counts[s.id]?'in progress':'ready for start'}</span><span class="card-arrow">→</span></div></button>`).join('')}</div><div class="archive-foot"><p>총 <strong>${total}개</strong>의 설계 기록이 아카이브에 저장되어 있습니다.</p><p class="mono">DONGGANG UNIVERSITY DEPARTMENT OF ARCHITECTURE</p></div></section>`}

</h2><form id="upForm"><div class="form-row"><div class="field"><label for="fWeek">주차</label><input type="number" id="fWeek" value="${nextWeek}" min="1" required></div><div class="field"><label for="fTitle">기록 제목</label><input type="text" id="fTitle" placeholder="예: 평면 배치 1차 스터디" required></div></div><div class="field"><label for="fDesc">진행 내용</label><textarea id="fDesc" placeholder="이번 주 설계의 관찰, 시도, 다음 단계를 기록해 주세요." required></textarea></div><div class="field"><label for="fImg">도면 또는 이미지</label><input type="file" id="fImg" accept="image/*"></div><button type="submit" class="submit-btn" id="upBtn">업로드 + AI 코멘트</button><p class="side-note">이미지는 포트폴리오 기록과 함께 저장되며, AI가 다음 설계 단계를 위한 피드백을 제공합니다.</p></form></aside></div>`;document.getElementById('upForm').addEventListener('submit',e=>submitUpload(e,id))}
function renderUploadCard(u,index,total){const review=analyzeRecord(u);return`<article class="up-card"><div class="week-stamp" aria-label="${u.week}주차"><strong>${pad(u.week)}</strong><span>WEEK</span></div><div class="entry"><div class="entry-top"><h3 class="entry-title">${esc(u.title)}</h3><span class="entry-number">LOG ${pad(total-index)}</span></div><div style="margin-top:13px;padding:10px 12px;border-left:2px solid var(--amber);background:#f7f0e3;color:#6f542c;font-family:var(--mono);font-size:10px;line-height:1.65;letter-spacing:.02em">${esc(recordSpecs[u.id]||'설계 기록 · 검토 필요')}</div>${u.imageUrl?`<img class="entry-image" src="${u.imageUrl}" alt="${esc(u.title)} 작업 이미지">`:''}<p class="entry-description">${esc(u.description)}</p><div class="record-evidence">${Object.entries(reviewRules).map(([key,rule])=>`<span>${rule.label} ${review.scores[key].score}</span>`).join('')}</div><div class="ai"><div class="lbl">AI DESIGN REVIEW · NEXT CHECK</div><div class="comment">${u.aiComment?esc(u.aiComment):'설계 코멘트를 준비하고 있습니다. 잠시 후 새로고침하면 피드백을 확인할 수 있습니다.'}</div><div class="priority">${review.priority} 우선순위 · ${review.weakest} 근거 보강 필요 · 탐지 근거 ${review.evidence}건</div></div></div></article>`}
async function submitUpload(e,studentId){e.preventDefault();const btn=document.getElementById('upBtn');btn.disabled=true;btn.textContent='기록 저장 중…';const week=parseInt(document.getElementById('fWeek').value)||1,title=document.getElementById('fTitle').value.trim(),description=document.getElementById('fDesc').value.trim(),fileInput=document.getElementById('fImg');let imageUrl=null,assetId=null;if(fileInput.files[0]&&assetsApi){try{const r=await assetsApi.upload(fileInput.files[0]);imageUrl=r.url;assetId=r.id}catch(err){}}const students=await ensureStudents(),student=students.find(s=>s.id===studentId),upId=studentId+'_w'+week+'_'+Date.now(),docData={studentId,week,title,description,imageUrl,assetId,createdAt:Date.now(),aiComment:''};if(db){try{await db.doc('uploads/'+upId).set(docData)}catch(err){}}await renderStudent(studentId,document.getElementById('app'));if(sampleApi){try{const prompt=`당신은 실내건축설계 스튜디오 지도교수입니다. 학생의 이번 주 진행 상황에 대해 한국어로 3~4문장의 건설적인 피드백을 작성하세요. 잘된 점을 구체적으로 짚고, 다음 주에 검증할 하나의 명확한 설계 과제를 제안하세요.\n\n학생: ${student?student.name:''}\n주차: ${week}주차\n제목: ${title}\n설명: ${description}`,result=await sampleApi(prompt,{modelTier:'default'}),comment=result&&result.text?result.text.trim():'';if(db&&comment){try{await db.doc('uploads/'+upId).update({aiComment:comment})}catch(err){}}if(location.hash==='#/s/'+studentId)await renderStudent(studentId,document.getElementById('app'))}catch(err){}}}
async function renameStudent(id){const students=await ensureStudents(),student=students.find(s=>s.id===id),newName=prompt('학생 이름을 입력하세요',student?student.name:'');if(!newName)return;if(db){try{await db.doc('students/'+id).update({name:newName.trim()})}catch(e){}}await renderStudent(id,document.getElementById('app'))}window.addEventListener('hashchange',route);route();
</script>
